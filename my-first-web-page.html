<!DOCTYPE html> <!-- Declares the document type as HTML5 -->
<html lang="en"> <!-- Root element of the HTML page, setting the language to English -->
<head> <!-- Contains metadata and title for the web page -->
    <meta charset="UTF-8"> <!-- Specifies the character encoding format as UTF-8 -->
    <title>My First Web Page</title> <!-- Sets the title displayed on the browser tab -->
</head> <!-- Closes the head section -->
<body> <!-- Contains all the visible body content of the web page -->
    <p>Username: Guangpeng Zuo</p> <!-- Displays the username information -->
    <p>Course Name: Intro to Website Development</p> <!-- Displays the course name information -->
    <p>Course Number: IS 117</p> <!-- Displays the course number information -->
    <p>Section: 001</p> <!-- Displays the course section information -->
    <footer> <!-- Defines the footer section of the web page -->
        <p>&copy; 2026 Guangpeng Zuo. Due Date: October 15, 2026</p> <!-- Displays the copyright symbol, name, and due date -->
    </footer> <!-- Closes the footer section -->
</body> <!-- Closes the body section -->
</html> <!-- Closes the root HTML element -->
